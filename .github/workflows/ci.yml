name: CI

on:
  push:
    branches: [main, Main]
  pull_request:
    branches: [main, Main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint || true

      - name: Build (tsup dual CJS/ESM)
        run: npm run build

      - name: Guard — no static node:crypto imports in dist
        run: |
          if grep -REn "from [\"'](node:)?crypto[\"']|require\([\"'](node:)?crypto[\"']\)" dist; then
            echo "ERROR: static node:crypto import found in dist/"
            exit 1
          fi

      - name: Test with coverage
        run: npm test

      - name: Smoke tests (CJS + ESM)
        run: npm run smoke

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == 20
        with:
          files: ./coverage/lcov.info
          flags: unittests
