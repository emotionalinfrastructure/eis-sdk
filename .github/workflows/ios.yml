name: iOS CI

on:
  push:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'
  pull_request:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'

jobs:
  build-and-test:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.3.app

      - name: Validate privacy manifest
        working-directory: swift/ios
        run: plutil -lint SupportingFiles/PrivacyInfo.xcprivacy

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: swift/ios
        run: xcodegen generate

      - name: Prepare iOS simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          rts = [r for r in json.load(sys.stdin)['runtimes']
                 if 'iOS' in r.get('name','') and r.get('isAvailable', False)]
          print(sorted(rts, key=lambda r: r['version'])[-1]['identifier'])
          ")
          echo "iOS runtime: $RUNTIME"
          xcrun simctl create 'CI-Device' 'iPhone 16' "$RUNTIME" 2>/dev/null \
            || xcrun simctl create 'CI-Device' 'iPhone SE (3rd generation)' "$RUNTIME"

      - name: Build & test
        working-directory: swift/ios
        run: |
          xcodebuild test \
            -project EmotionalOS.xcodeproj \
            -scheme EmotionalOS \
            -destination 'platform=iOS Simulator,name=CI-Device' \
            CODE_SIGNING_ALLOWED=NO
