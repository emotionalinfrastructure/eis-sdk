name: iOS CI

on:
  push:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'
  pull_request:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'

jobs:
  build-and-test:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Validate property lists
        working-directory: swift/ios
        run: |
          plutil -lint SupportingFiles/Info.plist
          plutil -lint SupportingFiles/PrivacyInfo.xcprivacy

      - name: Build & test (or validate scaffold)
        working-directory: swift/ios
        run: |
          project="$(ls -d *.xcodeproj *.xcworkspace 2>/dev/null | head -n1 || true)"
          if [ -n "$project" ]; then
            echo "Found $project — running build and test."
            xcodebuild build test \
              -scheme EmotionalOS \
              -destination 'platform=iOS Simulator,name=iPhone 15' \
              CODE_SIGNING_ALLOWED=NO
            exit 0
          fi

          echo "No .xcodeproj/.xcworkspace found — EmotionalOS is currently a source scaffold."
          echo "Verifying expected scaffold files are present…"
          required=(
            "Sources/EmotionalOS/ContentView.swift"
            "Sources/EmotionalOS/SignalProcessor.swift"
            "Sources/EmotionalOS/ToneManager.swift"
            "Sources/EmotionalOS/Models/CoreDataModels.xcdatamodeld"
            "SupportingFiles/Info.plist"
            "SupportingFiles/PrivacyInfo.xcprivacy"
            "fastlane/Fastfile"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -e "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Scaffold validation failed."
            exit 1
          fi
          echo "Scaffold OK. Add an .xcodeproj to enable full xcodebuild build/test."
