name: iOS CI

on:
  push:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'
  pull_request:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'

jobs:
  build-and-test:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Build
        working-directory: swift/ios
        run: |
          xcodebuild build \
            -scheme EmotionalOS \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        working-directory: swift/ios
        run: |
          xcodebuild test \
            -scheme EmotionalOS \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
