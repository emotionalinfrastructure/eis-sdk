name: iOS CI

on:
  push:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'
  pull_request:
    branches: [main, Main]
    paths:
      - 'swift/ios/**'

jobs:
  build-and-test:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting Xcode: $LATEST"
          sudo xcode-select -switch "$LATEST"
          xcodebuild -version

      - name: Validate privacy manifest
        working-directory: swift/ios
        run: plutil -lint SupportingFiles/PrivacyInfo.xcprivacy

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: swift/ios
        run: xcodegen generate

      - name: Create iOS Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          rts = [r for r in data['runtimes']
                 if 'iOS' in r.get('name', '') and r.get('isAvailable', False)]
          rts.sort(key=lambda r: [int(x) for x in r.get('version', '0').split('.')], reverse=True)
          if not rts:
              print('No iOS runtime found', file=sys.stderr); sys.exit(1)
          print(rts[0]['identifier'])
          ")
          DTYPE=$(xcrun simctl list devicetypes --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          phones = [d for d in data['devicetypes'] if 'iPhone' in d['name']]
          base = [d for d in phones
                  if 'Plus' not in d['name'] and 'Pro' not in d['name'] and 'Max' not in d['name']]
          print((base or phones)[-1]['identifier'])
          ")
          echo "Runtime: $RUNTIME"
          echo "Device type: $DTYPE"
          UDID=$(xcrun simctl create CI-Device "$DTYPE" "$RUNTIME")
          echo "Created simulator: $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build & test
        working-directory: swift/ios
        run: |
          xcodebuild test \
            -project EmotionalOS.xcodeproj \
            -scheme EmotionalOS \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO
